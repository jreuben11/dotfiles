# ── Options ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -sg escape-time 0
set -g focus-events on

# Thin prefix kept only for reload; all common bindings use Ctrl+letter (zellij-style)
set -g prefix C-b
bind C-b send-prefix
bind R source-file ~/.tmux.conf \; display "config reloaded"

# ── Global: Alt+h/j/k/l pane navigation (zellij shared_except "locked") ──────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-i swap-window -t -1 \; select-window -t -1
bind -n M-o swap-window -t +1 \; select-window -t +1
bind -n C-q confirm-before -p "kill session? (y/n)" kill-session

# ── Ctrl+p → pane mode (sticky) ───────────────────────────────────────────────
bind -n C-p switch-client -T pane_mode
bind -T pane_mode h      select-pane -L \; switch-client -T pane_mode
bind -T pane_mode j      select-pane -D \; switch-client -T pane_mode
bind -T pane_mode k      select-pane -U \; switch-client -T pane_mode
bind -T pane_mode l      select-pane -R \; switch-client -T pane_mode
bind -T pane_mode Left   select-pane -L \; switch-client -T pane_mode
bind -T pane_mode Down   select-pane -D \; switch-client -T pane_mode
bind -T pane_mode Up     select-pane -U \; switch-client -T pane_mode
bind -T pane_mode Right  select-pane -R \; switch-client -T pane_mode
bind -T pane_mode r      split-window -h -c "#{pane_current_path}"
bind -T pane_mode d      split-window -v -c "#{pane_current_path}"
bind -T pane_mode n      split-window    -c "#{pane_current_path}"
bind -T pane_mode f      resize-pane -Z
bind -T pane_mode x      kill-pane
bind -T pane_mode p      select-pane -t :.+
bind -T pane_mode c      command-prompt -p "rename pane:" "select-pane -T '%%'"
bind -T pane_mode C-p    switch-client -T root
bind -T pane_mode Escape switch-client -T root
bind -T pane_mode Enter  switch-client -T root

# ── Ctrl+t → tab mode (sticky) ────────────────────────────────────────────────
bind -n C-t switch-client -T tab_mode
bind -T tab_mode h      previous-window \; switch-client -T tab_mode
bind -T tab_mode k      previous-window \; switch-client -T tab_mode
bind -T tab_mode Left   previous-window \; switch-client -T tab_mode
bind -T tab_mode Up     previous-window \; switch-client -T tab_mode
bind -T tab_mode l      next-window \; switch-client -T tab_mode
bind -T tab_mode j      next-window \; switch-client -T tab_mode
bind -T tab_mode Right  next-window \; switch-client -T tab_mode
bind -T tab_mode Down   next-window \; switch-client -T tab_mode
bind -T tab_mode n      new-window -c "#{pane_current_path}"
bind -T tab_mode x      kill-window
bind -T tab_mode r      command-prompt -p "rename tab:" "rename-window '%%'"
bind -T tab_mode b      break-pane
bind -T tab_mode 1      select-window -t :1
bind -T tab_mode 2      select-window -t :2
bind -T tab_mode 3      select-window -t :3
bind -T tab_mode 4      select-window -t :4
bind -T tab_mode 5      select-window -t :5
bind -T tab_mode 6      select-window -t :6
bind -T tab_mode 7      select-window -t :7
bind -T tab_mode 8      select-window -t :8
bind -T tab_mode 9      select-window -t :9
bind -T tab_mode Tab    last-window \; switch-client -T tab_mode
bind -T tab_mode C-t    switch-client -T root
bind -T tab_mode Escape switch-client -T root
bind -T tab_mode Enter  switch-client -T root

# ── Ctrl+n → resize mode (sticky) ─────────────────────────────────────────────
# small: expand in that direction; capital: contract from that direction
bind -n C-n switch-client -T resize_mode
bind -T resize_mode h      resize-pane -L 5 \; switch-client -T resize_mode
bind -T resize_mode j      resize-pane -D 5 \; switch-client -T resize_mode
bind -T resize_mode k      resize-pane -U 5 \; switch-client -T resize_mode
bind -T resize_mode l      resize-pane -R 5 \; switch-client -T resize_mode
bind -T resize_mode H      resize-pane -R 5 \; switch-client -T resize_mode
bind -T resize_mode J      resize-pane -U 5 \; switch-client -T resize_mode
bind -T resize_mode K      resize-pane -D 5 \; switch-client -T resize_mode
bind -T resize_mode L      resize-pane -L 5 \; switch-client -T resize_mode
bind -T resize_mode Left   resize-pane -L 5 \; switch-client -T resize_mode
bind -T resize_mode Down   resize-pane -D 5 \; switch-client -T resize_mode
bind -T resize_mode Up     resize-pane -U 5 \; switch-client -T resize_mode
bind -T resize_mode Right  resize-pane -R 5 \; switch-client -T resize_mode
bind -T resize_mode C-n    switch-client -T root
bind -T resize_mode Escape switch-client -T root
bind -T resize_mode Enter  switch-client -T root

# ── Ctrl+s → scroll/copy mode ─────────────────────────────────────────────────
bind -n C-s copy-mode
bind -T copy-mode-vi C-s send -X cancel
bind -T copy-mode-vi j    send -X cursor-down
bind -T copy-mode-vi k    send -X cursor-up
bind -T copy-mode-vi d    send -X halfpage-down
bind -T copy-mode-vi u    send -X halfpage-up
bind -T copy-mode-vi C-f  send -X page-down
bind -T copy-mode-vi C-b  send -X page-up

# ── Ctrl+o → session mode ─────────────────────────────────────────────────────
bind -n C-o switch-client -T session_mode
bind -T session_mode w      choose-tree -s
bind -T session_mode d      detach-client
bind -T session_mode C-o    switch-client -T root
bind -T session_mode Escape switch-client -T root
bind -T session_mode Enter  switch-client -T root

# ── Mode indicator in status-left (mirrors zellij mode display) ───────────────
set -g status-left "#{?#{==:#{client_key_table},pane_mode},#[fg=#1e1e2e bg=#a6e3a1 bold] PANE #[default],#{?#{==:#{client_key_table},tab_mode},#[fg=#1e1e2e bg=#89b4fa bold] TAB #[default],#{?#{==:#{client_key_table},resize_mode},#[fg=#1e1e2e bg=#fab387 bold] RESIZE #[default],#{?#{==:#{client_key_table},session_mode},#[fg=#1e1e2e bg=#cba6f7 bold] SESSION #[default], }}}}#[default][#S] "
set -g status-left-length 20

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'
